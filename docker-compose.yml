version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: app_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cloudnaut
      - POSTGRES_PASSWORD=cloudnaut_pass
      - POSTGRES_DB=cloudnaut_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnaut -d cloudnaut_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: