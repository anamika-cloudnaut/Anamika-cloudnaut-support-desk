services:
  db:
    image: postgres:16-alpine
    container_name: app_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cloudnaut
      - POSTGRES_PASSWORD=cloudnaut_pass
      - POSTGRES_DB=cloudnaut_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnaut -d cloudnaut_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build: 
      context: ./workspace/frontend
      dockerfile: Dockerfile
    container_name: app_frontend
    ports:
      - "3000:5173"
    environment:
      - REACT_APP_API_URL=http://localhost:4000
    depends_on:
      - backend
      - api
      - db
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build: 
      context: .
      dockerfile: workspace/backend/Dockerfile
    container_name: app_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://cloudnaut:cloudnaut_pass@db:5432/cloudnaut_db
      - API_SERVICE_URL=http://api:4000
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env before starting}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - db
      - mailpit
    networks:
      - app_network
    restart: unless-stopped

  api:
    build: 
      context: ./workspace/api
      dockerfile: Dockerfile
    container_name: app_api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - BACKEND_URL=http://backend:8001
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env before starting}
    depends_on:
      - backend
      - db
    networks:
      - app_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
