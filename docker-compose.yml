services:
  db:
    image: postgres:16
    container_name: app_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=cloudnaut
      - POSTGRES_PASSWORD=cloudnaut_pass
      - POSTGRES_DB=cloudnaut_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnaut -d cloudnaut_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./workspace/backend
      dockerfile: Dockerfile
    container_name: app_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cloudnaut:cloudnaut_pass@db:5432/cloudnaut_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pgdata: