name: CI

# Run on every push and on pull requests targeting main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r workspace/backend/requirements.txt
      - name: Run unit tests (no external services needed)
        working-directory: workspace
        env:
          # Tests construct their own in-memory SQLite; a dummy secret keeps
          # any auth import happy without real credentials.
          AUTH_SECRET_KEY: ci-dummy-secret-not-used-for-real-auth
        run: |
          python -m pytest \
            backend/tests/test_status_workflow.py \
            backend/tests/test_request_service.py \
            backend/tests/test_request_workflows.py \
            backend/tests/test_missing_workflows.py \
            -q

  infra:
    name: Infra (CDK synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      # Type-check the CDK app. This validates the infrastructure code without
      # needing AWS credentials or Docker. (A full `cdk synth` is skipped in CI
      # because the stack builds Docker image assets, which is slow/brittle on a
      # bare runner and unnecessary just to validate the code compiles.)
      - name: Type-check (tsc)
        run: npm run build
